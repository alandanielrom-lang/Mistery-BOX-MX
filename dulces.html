<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dulces - Mystery Box</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a12;
  color: white;
}

/* NAV */
nav {
  padding: 20px 40px;
  background: rgba(0,0,0,0.8);
}

nav a {
  color: white;
  text-decoration: none;
}

/* HERO */
.hero {
  height: 50vh;
  background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url('fondopp4.png') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero h1 {
  font-size: 45px;
  text-shadow: 0 0 20px #ff9800;
}

/* SECCIONES */
.container {
  padding: 60px;
}

.box {
  display: flex;
  align-items: center;
  gap: 40px;
  margin-bottom: 60px;
  background: #121222;
  padding: 30px;
  border-radius: 20px;
}

.box img {
  width: 40%;
  border-radius: 20px;
}

/* BLOQUEADO */
.locked {
  opacity: 0.4;
  pointer-events: none;
  position: relative;
}

.locked::after {
  content: "PRÓXIMAMENTE";
  position: absolute;
  top: 20px;
  right: 20px;
  background: #ff9800;
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 10px;
}

/* BOTONES */
button {
  margin-top: 15px;
  padding: 12px 25px;
  background: linear-gradient(45deg, #ff9800, #ff5722);
  border: none;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px #ff9800;
}

button:hover {
  transform: scale(1.1);
}

/* RULETA */
.ruleta {
  margin-top: 20px;
  width: 150px;
  height: 150px;
  border: 5px solid #ff9800;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 2s ease-out;
}

.resultado {
  margin-top: 10px;
  color: #ff9800;
}
</style>
</head>

<body>

<nav>
  <a href="productos.html">← Regresar</a>
</nav>

<section class="hero">
  <h1>Cajas de Dulces</h1>
</section>

<div class="container">

  <!-- CLÁSICOS -->
  <div class="box">
    <img src="cajad1.png">
    <div>
      <h2>Dulces Clásicos</h2>
      <p>Sabores tradicionales con sorpresa.</p>

      <button onclick="girarRuleta(this)">Girar ruleta</button>

      <div class="ruleta">🎡</div>
      <div class="resultado"></div>
    </div>
  </div>

  <!-- PICANTES -->
  <div class="box locked" onclick="proximamente()">
    <img src="cajad1.png">
    <div>
      <h2>Dulces Picantes</h2>
      <p>Experiencia intensa.</p>
      <button>Próximamente</button>
    </div>
  </div>

  <!-- MIXTOS -->
  <div class="box locked" onclick="proximamente()">
    <img src="cajad1.png">
    <div>
      <h2>Mixtos</h2>
      <p>Combinación completa.</p>
      <button>Próximamente</button>
    </div>
  </div>

</div>

<script>
function girarRuleta(boton) {
  const contenedor = boton.parentElement;
  const ruleta = contenedor.querySelector(".ruleta");
  const resultadoDiv = contenedor.querySelector(".resultado");

  if (resultadoDiv.innerHTML !== "") return;

  const giro = Math.floor(Math.random() * 3600) + 720;
  ruleta.style.transform = "rotate(" + giro + "deg)";

  setTimeout(() => {
    const numero = Math.floor(Math.random() * 5) + 1;
    const resultado = "Caja " + numero;

    resultadoDiv.innerHTML = resultado;

    const mensaje = `Hola, quiero la ${resultado} de Dulces Clásicos`;
    window.open(`https://wa.me/5212712387123?text=${encodeURIComponent(mensaje)}`);

  }, 2000);
}

function proximamente() {
  alert("Esta categoría estará disponible próximamente.");
}
</script>

</body>
</html>
