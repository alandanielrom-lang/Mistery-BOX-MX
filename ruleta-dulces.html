<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ruleta Dulces</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0a0a12;
  color: white;
  text-align: center;
}

/* NAV */
nav {
  padding: 20px;
}

nav a {
  color: white;
  text-decoration: none;
}

/* CONTENEDOR */
.container {
  margin-top: 40px;
}

/* RULETA */
.ruleta-container {
  position: relative;
  width: 300px;
  margin: auto;
}

.ruleta {
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 8px solid #ff9800;
  position: relative;
  overflow: hidden;
  transition: transform 4s ease-out;
}

/* SECCIONES */
.sector {
  position: absolute;
  width: 50%;
  height: 50%;
  background: #111;
  transform-origin: 100% 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sector span {
  transform: rotate(36deg);
  font-size: 14px;
}

/* COLORES alternos */
.s1 { transform: rotate(0deg) skewY(-30deg); background:#111;}
.s2 { transform: rotate(72deg) skewY(-30deg); background:#222;}
.s3 { transform: rotate(144deg) skewY(-30deg); background:#111;}
.s4 { transform: rotate(216deg) skewY(-30deg); background:#222;}
.s5 { transform: rotate(288deg) skewY(-30deg); background:#111;}

/* FLECHA */
.flecha {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
  color: #ff9800;
}

/* BOTÓN */
button {
  margin-top: 20px;
  padding: 15px 30px;
  background: linear-gradient(45deg, #ff9800, #ff5722);
  border: none;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 20px #ff9800;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}

/* INPUT */
input {
  margin-top: 20px;
  padding: 10px;
  width: 250px;
  border: none;
  border-radius: 10px;
  text-align: center;
}

/* RESULTADO */
.resultado {
  margin-top: 20px;
  font-size: 22px;
  color: #ff9800;
}
</style>
</head>

<body>

<nav>
  <a href="dulces.html">← Regresar</a>
</nav>

<div class="container">

  <h1>Gira la ruleta</h1>

  <div class="ruleta-container">
    <div class="flecha">▼</div>

    <div class="ruleta" id="ruleta">

      <div class="sector s1"><span>Caja 1</span></div>
      <div class="sector s2"><span>Caja 2</span></div>
      <div class="sector s3"><span>Caja 3</span></div>
      <div class="sector s4"><span>Caja 4</span></div>
      <div class="sector s5"><span>Caja 5</span></div>

    </div>
  </div>

  <input type="text" id="nombre" placeholder="Escribe tu nombre">

  <br>

  <button id="boton" onclick="girar()">Girar</button>

  <div class="resultado" id="resultado"></div>

</div>

<script>
let girado = false;
let resultadoFinal = "";

function girar() {
  if (girado) return;
  girado = true;

  const ruleta = document.getElementById("ruleta");
  const resultadoDiv = document.getElementById("resultado");
  const boton = document.getElementById("boton");

  const numero = Math.floor(Math.random() * 5) + 1;
  const grados = 3600 + (numero * 72);

  ruleta.style.transform = "rotate(" + grados + "deg)";

  setTimeout(() => {
    resultadoFinal = "Caja " + numero;
    resultadoDiv.innerHTML = "Te tocó: " + resultadoFinal;

    boton.innerHTML = "Enviar pedido";
    boton.onclick = enviar;

  }, 4000);
}

function enviar() {
  const nombre = document.getElementById("nombre").value || "Cliente";

  const mensaje = `Hola, soy ${nombre}. 
Quiero la ${resultadoFinal} de Dulces Clásicos.
Quiero acordar el lugar de entrega.`;

  window.open(`https://wa.me/5212711021374?text=${encodeURIComponent(mensaje)}`);
}
</script>

</body>
</html>
